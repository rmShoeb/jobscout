<div *ngIf="isOpen()" class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.6);" (click)="onClose()">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="modal-header text-white border-0 py-3" [ngClass]="isError() ? 'bg-danger' : 'bg-primary'">
        <h5 class="modal-title fw-bold mb-0" [innerHTML]="title()"></h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="onClose()"></button>
      </div>
      <div class="modal-body p-4 text-center bg-white">
        <i *ngIf="!isError()" class="bi bi-info-circle-fill text-primary mb-3 d-block" style="font-size: 3.5rem;"></i>
        <i *ngIf="isError()" class="bi bi-exclamation-triangle-fill text-danger mb-3 d-block" style="font-size: 3.5rem;"></i>
        <p class="fs-5 text-secondary px-3" [innerHTML]="message()"></p>
      </div>
      <div class="modal-footer border-0 justify-content-center pb-4 pt-1 bg-white">
        <button type="button" class="btn px-5 py-2 fw-semibold rounded-pill shadow-sm text-white" [ngClass]="isError() ? 'btn-danger' : 'btn-primary'" (click)="onClose()">Got it</button>
      </div>
    </div>
  </div>
</div>
