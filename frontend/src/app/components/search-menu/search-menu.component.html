<div class="card shadow-lg border-0 rounded-4 overflow-hidden mb-5">
  <div class="card-header bg-primary text-white py-3 border-bottom-0 ps-4">
    <h4 class="mb-0 fw-bold d-flex align-items-center">Job Scout</h4>
    <p class="mb-0 text-white-50 small mt-1">Find your next role...</p>
  </div>

  <div class="card-body p-4 bg-white">
    <!-- Using ngSubmit on a form allows native Enter key binding to trigger search seamlessly -->
    <form (ngSubmit)="onSearch()">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="keywordInput" class="form-label fw-bold text-secondary mb-1">Keywords, or Title <span
              class="text-danger">*</span></label>
          <input type="text" id="keywordInput" class="form-control form-control shadow-sm border-light"
            [(ngModel)]="keyword" name="keyword" placeholder="e.g. Senior Angular Developer" required>
        </div>

        <div class="col-md-6">
          <label for="companyInput" class="form-label fw-bold text-secondary mb-1">Company</label>
          <input type="text" id="companyInput" class="form-control form-control shadow-sm border-light"
            placeholder="e.g. Mozilla">
        </div>

        <div class="col-md-3">
          <label for="maxAgeInput" class="form-label fw-bold text-secondary mb-1">Max Age (Days) <span
              class="text-danger">*</span></label>
          <input type="number" id="maxAgeInput" class="form-control form-control shadow-sm border-light"
            [(ngModel)]="maxAgeDays" name="maxAgeDays" min="1" max="365" required>
        </div>

        <div class="col-md-3">
          <label for="experienceLevelInput" class="form-label fw-bold text-secondary mb-1">Experience Level</label>
          <mat-select multiple>
            @for (level of experienceLevelList; track level) {
            <mat-option [value]="level">{{level}}</mat-option>
            }
          </mat-select>
        </div>

        <div class="col-md-3">
          <label for="jobTypeInput" class="form-label fw-bold text-secondary mb-1">Job Type</label>
          <mat-select multiple>
            @for (level of jobTypeList; track level) {
            <mat-option [value]="level">{{level}}</mat-option>
            }
          </mat-select>
        </div>

        <div class="col-md-3">
          <!-- <mat-slide-toggle [(ngModel)]="isChecked">Slide Toggle Checked: {{isChecked}}</mat-slide-toggle> -->
          <mat-slide-toggle>Remote</mat-slide-toggle>
        </div>

        <div class="col-md-4 mt-4">
          <label for="locationInput" class="form-label fw-semibold text-secondary mb-1">Preferred Location</label>
          <input type="text" id="locationInput" class="form-control shadow-sm border-light" [(ngModel)]="location"
            name="location" placeholder="e.g. Bangladesh">
        </div>

        <div class="col-md-4 mt-4">
          <label for="ignoreLocationInput" class="form-label fw-semibold text-secondary mb-1">Ignore Locations</label>
          <input type="text" id="ignoreLocationInput" class="form-control shadow-sm border-light"
            [(ngModel)]="ignoreLocations" name="ignoreLocations" placeholder="e.g. Pissrael">
        </div>
      </div>

      <div class="d-flex justify-content-end align-items-center mt-4 pt-3 border-top gap-3">
        <button type="button" class="btn btn-light px-4 fw-semibold text-secondary border shadow-sm"
          (click)="onClear()">Clear Form</button>
        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow" [disabled]="!keyword.trim()">Start
          Search</button>
      </div>
    </form>
  </div>
</div>
