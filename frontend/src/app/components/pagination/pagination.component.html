<div class="d-flex justify-content-between align-items-center flex-wrap mt-4 mb-4">
  <div class="d-flex align-items-center mb-2 mb-sm-0 bg-white p-2 rounded-3 shadow-sm border">
    <label for="pageSize" class="me-2 fw-semibold text-secondary small mb-0 ms-1">Items per page:</label>
    <select id="pageSize" class="form-select form-select-sm w-auto border-0 bg-light cursor-pointer fw-bold text-primary" [value]="pageSize()" (change)="onSizeChange($event)">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
    </select>
  </div>
  
  <nav aria-label="Job Search Pagination">
    <ul class="pagination mb-0 shadow-sm">
      <li class="page-item" [class.disabled]="currentPage() <= 1">
        <button class="page-link border-0 fw-semibold px-3 py-2" (click)="onPageChange(currentPage() - 1)">Previous</button>
      </li>
      <li class="page-item active">
        <span class="page-link border-0 fw-bold px-4 py-2 bg-primary">{{ currentPage() }} <span class="text-white-50 mx-1">of</span> {{ totalPages() }}</span>
      </li>
      <li class="page-item" [class.disabled]="currentPage() >= totalPages()">
        <button class="page-link border-0 fw-semibold px-3 py-2" (click)="onPageChange(currentPage() + 1)">Next</button>
      </li>
    </ul>
  </nav>
</div>
