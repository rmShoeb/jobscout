<div class="d-flex justify-content-center align-items-center mt-4 mb-4">
  <nav aria-label="Job Search Pagination">
    <ul class="pagination mb-0 shadow-sm">
      <li class="page-item" [class.disabled]="currentPage() <= 1">
        <button class="page-link border-0 fw-semibold px-4 py-2" (click)="onPageChange(currentPage() - 1)">
          <i class="bi bi-chevron-left me-1"></i> Previous
        </button>
      </li>
      <li class="page-item active">
        <span class="page-link border-0 fw-bold px-4 py-2 bg-primary">Page {{ currentPage() }}</span>
      </li>
      <li class="page-item" [class.disabled]="!hasMoreResults()">
        <button class="page-link border-0 fw-semibold px-4 py-2" (click)="onPageChange(currentPage() + 1)">
          Next <i class="bi bi-chevron-right ms-1"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
