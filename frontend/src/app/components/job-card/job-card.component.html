<div class="card shadow-sm h-100 mb-2 border-0" style="cursor: pointer; transition: transform 0.2s; background: #f8f9fa;" (click)="onCardClick()" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
  <div class="card-body">
    <h5 class="card-title text-primary fw-bold">{{ job().title }}</h5>
    <h6 class="card-subtitle mb-2 text-muted fw-semibold">
      <i class="bi bi-geo-alt"></i> {{ job().location }} &bull; 
      <i class="bi bi-briefcase"></i> {{ job().type }}
    </h6>
    <p class="card-text text-secondary mt-3">{{ job().descriptionSnippet || 'Click to view full description and details.' }}</p>
  </div>
  <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between align-items-center mb-1">
    <span class="badge bg-success rounded-pill px-3 py-2">{{ job().salary || 'Salary Not Provided' }}</span>
  </div>
</div>
